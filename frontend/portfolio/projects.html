<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--=============== FAVICON ===============-->
    <link rel="shortcut icon" href="assets/logo-white.png" type="image/x-icon" />

    <!--=============== REMIXICONS ===============-->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <!-- ============= Scroll reveal ============== -->
    <script src="https://unpkg.com/scrollreveal"></script>

    <!--=============== GOOGLE FONTS (Poppins) ===============-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="assets/css/styles.css" />

    <title id="page-title">All Projects</title>
  </head>
  <body class="dark-theme">
    <!--==================== TOP BAR ====================-->
    <header class="topbar" id="topbar">
      <nav class="navbar container">
        <a href="/" class="navbar__brand" style="font-family: 'Stereofunk', roboto">
          <img class="logo" src="assets/logo-white.png" alt="Logo" />
        </a>
        <div class="navbar__menu" id="nav-menu">
          <ul class="navbar__items grid">
            <li class="navbar__element">
              <a href="/" class="navbar__url">
                <i class="ri-home-line"></i> Home
              </a>
            </li>
            <li class="navbar__element">
              <a href="/skills" class="navbar__url">
                <i class="ri-code-line"></i> Skills
              </a>
            </li>
            <li class="navbar__element">
              <a href="/education" class="navbar__url">
                <i class="ri-book-line"></i> Education
              </a>
            </li>
            <li class="navbar__element">
              <a href="/services" class="navbar__url">
                <i class="ri-service-line"></i> Services
              </a>
            </li>
            <li class="navbar__element">
              <a href="/projects" class="navbar__url active-url">
                <i class="ri-macbook-line"></i> Works
              </a>
            </li>
            <li class="navbar__element">
              <a href="/connect" class="navbar__url">
                <i class="ri-chat-4-line"></i> Connect
              </a>
            </li>
          </ul>

          <!-- Close button -->
          <div class="navbar__close" id="nav-close">
            <i class="ri-close-line"></i>
          </div>
        </div>

        <div class="navbar__actions">
          <!-- Theme change button -->
          <i class="ri-moon-line toggle-theme" id="theme-toggle"></i>

          <!-- Toggle button -->
          <div class="navbar__toggle" id="nav-toggle">
            <i class="ri-menu-line"></i>
          </div>
        </div>
      </nav>
    </header>

    <!--==================== MAIN CONTENT ====================-->
    <main class="projects-page">
      <!--==================== PROJECTS LISTING ====================-->
      <section class="projects-page__heading" id="projects-list">
        <h2>All <span>Projects</span></h2>
        <p class="projects-page__count" id="projects-count"></p>
        <div class="portfolio__wrapper container segment__divider">
          <div class="projects-grid" id="projects-grid">
            <p class="hero__loading">Loading...</p>
          </div>
        </div>
      </section>
    </main>

    <!--==================== FOOTER ====================-->
    <footer class="page-footer">
      <div class="page-footer__container container">
        <h1 class="page-footer__title">
          <a href="/">
            <img class="logo" src="assets/logo-white.png" alt="Logo" />
          </a>
        </h1>
        <p class="page-footer__tagline" id="footer-tagline">
          Creating digital experiences that matter
        </p>
        <ul class="page-footer__links">
          <li><a href="/" class="page-footer__link">Home</a></li>
          <li><a href="/skills" class="page-footer__link">Skills</a></li>
          <li><a href="/education" class="page-footer__link">Education</a></li>
          <li><a href="/services" class="page-footer__link">Services</a></li>
          <li><a href="/projects" class="page-footer__link">Works</a></li>
          <li><a href="/connect" class="page-footer__link">Connect</a></li>
        </ul>
        <ul class="page-footer__social" id="footer-social"></ul>
        <span class="page-footer__copyright" id="copyright-text"></span>
      </div>
    </footer>

    <!--========== SCROLL TO TOP ==========-->
    <a href="#" class="scroll-top" id="scroll-top">
      <i class="ri-arrow-up-line"></i>
    </a>

    <!--=============== PROJECTS PAGE JS ===============-->
    <script src="assets/js/projects.js"></script>
  </body>
</html>
