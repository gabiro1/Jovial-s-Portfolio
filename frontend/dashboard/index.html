<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Portfolio Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet" />
  <link href="/dashboard/css/dashboard.css" rel="stylesheet" />
</head>
<body>
  <div class="dash">
    <!--=============== SIDEBAR ===============-->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img id="sidebar-logo" src="/assets/logo-white.png" alt="Logo" />
        <span class="sidebar__brand-text">Admin Panel</span>
      </div>

      <nav class="sidebar__nav">
        <p class="sidebar__label">Manage</p>
        <ul>
          <li>
            <a href="#overview" class="sidebar__item" data-route="overview">
              <i class="ri-dashboard-line"></i> Overview
            </a>
          </li>
          <li>
            <a href="#profile" class="sidebar__item" data-route="profile">
              <i class="ri-user-line"></i> Profile & Bio
            </a>
          </li>
          <li>
            <a href="#skills" class="sidebar__item" data-route="skills">
              <i class="ri-code-line"></i> Skills
            </a>
          </li>
          <li>
            <a href="#projects" class="sidebar__item" data-route="projects">
              <i class="ri-macbook-line"></i> Projects
            </a>
          </li>
          <li>
            <a href="#experience" class="sidebar__item" data-route="experience">
              <i class="ri-briefcase-line"></i> Experience
            </a>
          </li>
          <li>
            <a href="#education" class="sidebar__item" data-route="education">
              <i class="ri-graduation-cap-line"></i> Education
            </a>
          </li>
          <li>
            <a href="#services" class="sidebar__item" data-route="services">
              <i class="ri-service-line"></i> Services
            </a>
          </li>
          <li>
            <a href="#social" class="sidebar__item" data-route="social">
              <i class="ri-share-line"></i> Social Links
            </a>
          </li>
          <li>
            <a href="#messages" class="sidebar__item" data-route="messages">
              <i class="ri-chat-4-line"></i> Messages
              <span class="sidebar__badge" id="msg-badge" style="display:none">0</span>
            </a>
          </li>
          <li>
            <a href="#settings" class="sidebar__item" data-route="settings">
              <i class="ri-settings-3-line"></i> Settings
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar__footer">
        <a href="/" target="_blank"><i class="ri-external-link-line"></i> View Portfolio</a>
        <button class="danger-btn" id="logout-btn"><i class="ri-logout-box-line"></i> Logout</button>
      </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!--=============== MAIN ===============-->
    <main class="main">
      <header class="topbar">
        <div class="topbar__left">
          <button class="topbar__toggle" id="sidebar-toggle" aria-label="Toggle menu">
            <i class="ri-menu-line"></i>
          </button>
          <h1 class="topbar__title" id="page-title">Overview</h1>
        </div>
        <div class="topbar__right">
          <button class="topbar__btn" id="theme-toggle" title="Toggle theme">
            <i class="ri-sun-line" id="theme-icon"></i>
          </button>
          <div class="topbar__user">
            <div class="topbar__avatar" id="user-avatar">A</div>
            <span id="user-name">Admin</span>
          </div>
        </div>
      </header>

      <div class="content" id="page-content">
        <div class="loading"><div class="spinner"></div><p>Loading...</p></div>
      </div>
    </main>
  </div>

  <div class="modal" id="app-modal"></div>
  <div class="toast" id="toast"><i class="ri-check-line"></i><span id="toast-msg"></span></div>

  <script src="/dashboard/js/api.js"></script>
  <script>window.Pages = window.Pages || {};</script>
  <script src="/dashboard/js/pages/overview.js"></script>
  <script src="/dashboard/js/pages/profile.js"></script>
  <script src="/dashboard/js/pages/skills.js"></script>
  <script src="/dashboard/js/pages/projects.js"></script>
  <script src="/dashboard/js/pages/experience.js"></script>
  <script src="/dashboard/js/pages/education.js"></script>
  <script src="/dashboard/js/pages/social.js"></script>
  <script src="/dashboard/js/pages/messages.js"></script>
  <script src="/dashboard/js/pages/services.js"></script>
  <script src="/dashboard/js/pages/settings.js"></script>
  <script src="/dashboard/js/app.js"></script>
</body>
</html>
